<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C15F3C"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- left chevron > -->
  <path d="M48 84 L86 118 L48 152" fill="none" stroke="#ffffff" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- underscore cursor -->
  <rect x="98" y="140" width="52" height="13" rx="6.5" fill="#ffffff"/>
  <!-- right chevron < (mirror of left, vertex points inward) -->
  <path d="M200 84 L162 118 L200 152" fill="none" stroke="#ffffff" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- three dots at the three endpoints of right < -->
  <g fill="#ffffff">
    <circle cx="200" cy="84" r="16"/>
    <circle cx="162" cy="118" r="16"/>
    <circle cx="200" cy="152" r="16"/>
  </g>
</svg>
